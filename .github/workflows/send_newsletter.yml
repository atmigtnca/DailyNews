name: Send Newsletter to Slack

on:
  push:
    branches:
      - main
    paths:
      # All paths provided by the user
      - '뉴스레터/**.md'
      - '프로덕트/**.md'
      - '논문/**.md'

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the repository code. (OK)
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      # 2. Automatically find the path of the changed file. (OK)
      - name: Find changed newsletter file
        id: find_file
        run: |
          # Force git to output UTF-8 (Korean) paths correctly
          git config --global core.quotepath false
          
          # Find the changed file using the reliable commit SHAs
          CHANGED_FILE=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} | grep -E '뉴스레터/.*\.md|프로덕트/.*\.md|논문/.*\.md' | head -n 1)

          if [ -z "$CHANGED_FILE" ]; then
            echo "::error::No matching file found in changes between commits."
            exit 1
          fi
          
          echo "Found file: $CHANGED_FILE"
          echo "filepath=$CHANGED_FILE" >> $GITHUB_OUTPUT

      # 3. Set custom message based on file path. (OK)
      - name: Set Custom Slack Message
        id: set_message
        run: |
          FILEPATH="${{ steps.find_file.outputs.filepath }}"
          TODAY_KST=$(TZ="Asia/Seoul" date '+%-m월 %-d일')
          MSG_HEADER=""

          if [[ "$FILEPATH" == 뉴스레터* ]]; then
            MSG_HEADER="$TODAY_KST 오늘의 뉴스레터가 도착했습니다! 🚀"
          elif [[ "$FILEPATH" == 프로덕트* ]]; then
            MSG_HEADER="$TODAY_KST 오늘의 프로덕트가 도착했습니다! 🚀"
          elif [[ "$FILEPATH" == 논문* ]]; then
            MSG_HEADER="$TODAY_KST 오늘의 논문이 도착했습니다! 🚀"
          else
            MSG_HEADER="$TODAY_KST 새 소식($FILEPATH)이 도착했습니다! 🚀"
          fi
          
          echo "Slack Title: $MSG_HEADER"
          echo "title=$MSG_HEADER" >> $GITHUB_OUTPUT

      # 4. Read the content of the file found above.
      - name: Read newsletter file
        id: newsletter
        run: |
          content=$(cat "${{ steps.find_file.outputs.filepath }}")
          
          # Escape special characters for Slack JSON
          content="${content//'%'/'%25'}"
          content="${content//$'\n/'\\n'}"
          content="${content//$'\r/'\\r'}"
          
          # --- FINAL FIX (NEW) ---
          # Use EOF syntax for multiline strings in GITHUB_OUTPUT
          # This prevents the "Invalid format" error.
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$content" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 5. Send to Slack. (OK)
      - name: Send to Slack
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "${{ steps.set_message.outputs.title }}",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "📰 ${{ steps.set_message.outputs.title }}"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ steps.newsletter.outputs.content }}"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
