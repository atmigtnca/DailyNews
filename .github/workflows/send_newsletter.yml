name: Send Newsletter to Slack

on:
  push:
    branches:
      - main
    paths:
      - '뉴스레터/**.md'
      - '프로덕트/**.md'
      - '논문/**.md'

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the repository code.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      # 2. Find ALL changed newsletter files
      - name: Find changed newsletter files
        id: find_files
        run: |
          git config --global core.quotepath false
          CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} | grep -E '뉴스레터/.*\.md|프로덕트/.*\.md|논문/.*\.md')
          if [ -z "$CHANGED_FILES" ]; then
            echo "No matching files found."
            echo "files_found=false" >> $GITHUB_OUTPUT
          else
            echo "Found files:"
            echo "$CHANGED_FILES"
            echo "files_found=true" >> $GITHUB_OUTPUT
            echo "file_list<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      # 3. (FINAL) Loop, Dynamically Truncate, and Send
      - name: Loop and Send to Slack
        if: steps.find_files.outputs.files_found == 'true'
        run: |
          # Exit immediately if any command fails
          set -e
          
          FILE_LIST="${{ steps.find_files.outputs.file_list }}"
          TODAY_KST=$(TZ="Asia/Seoul" date '+%-m월 %-d일')
          
          while IFS= read -r FILEPATH; do
            if [ -z "$FILEPATH" ]; then
              continue
            fi
            echo "Processing file: $FILEPATH"
            
            # --- 3a. Set Custom Slack Message ---
            MSG_HEADER=""
            if [[ "$FILEPATH" == 뉴스레터* ]]; then
              MSG_HEADER="$TODAY_KST 오늘의 뉴스레터가 도착했습니다! 🚀"
            elif [[ "$FILEPATH" == 프로덕
