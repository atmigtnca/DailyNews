name: Send Newsletter

on:
  push:
    paths:
      - '뉴스레터/**'
      - '프로덕트/**'
      - '논문/**'
  workflow_dispatch:

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Find changed files
        id: check_files
        run: |
          git config --global core.quotepath false
          
          # Push 이벤트일 경우 커밋 내역에서 변경된 md 파일 찾기 (뉴스레터, 프로덕트, 논문 폴더)
          if [ "${{ github.event_name }}" == "push" ]; then
             CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E '^(뉴스레터|프로덕트|논문)/.*\.md$' | head -n 1 || true)
          else
             # 수동 실행(workflow_dispatch)일 경우 각 폴더에서 가장 최신 파일 하나 찾기
             CHANGED_FILES=$(find 뉴스레터 프로덕트 논문 -name "*.md" 2>/dev/null | sort -r | head -n 1)
          fi

          if [ -z "$CHANGED_FILES" ]; then
            echo "No matching files found."
            echo "files_found=false" >> $GITHUB_OUTPUT
          else
            echo "Found file: $CHANGED_FILES"
            echo "files_found=true" >> $GITHUB_OUTPUT
            echo "target_file=$CHANGED_FILES" >> $GITHUB_OUTPUT
          fi

      - name: Send Slack with Images
        if: steps.check_files.outputs.files_found == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          FILE_PATH: ${{ steps.check_files.outputs.target_file }}
        run: |
          python .github/scripts/send_formatted_slack.py
