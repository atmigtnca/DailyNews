name: Send Newsletter to Slack

on:
  push:
    branches:
      - main
    paths:
      # All paths provided by the user
      - '뉴스레터/**.md'
      - '프로덕트/**.md'
      - '논문/**.md'

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the repository code.
      #    Must use 'fetch-depth: 0' (full clone) to ensure
      #    the 'before' and 'after' commits are available for diff.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      # 2. Automatically find the path of the changed file from the last commit.
      - name: Find changed newsletter file
        id: find_file
        run: |
          echo "Comparing commits: ${{ github.event.before }} ... ${{ github.event.after }}"
          
          # UPDATED: Use the reliable GitHub event SHAs instead of 'HEAD~1'
          # This correctly finds files from merge commits made by 'sync-fork'.
          CHANGED_FILE=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} | grep -E '뉴스레터/.*\.md|프로덕트/.*\.md|논문/.*\.md' | head -n 1)

          if [ -z "$CHANGED_FILE" ]; then
            echo "::error::No matching file found in changes between commits."
            exit 1 # Fail the workflow if no matching file is found.
          fi
          
          echo "Found file: $CHANGED_FILE"
          # Set the found file path as an output variable for the next step.
          echo "::set-output name=filepath::$CHANGED_FILE"

      # 3. Read the content of the file found above and save it as a variable.
      - name: Read newsletter file
        id: newsletter
        run: |
          # Read the content using the dynamic file path (${...}) found in step 2.
          content=$(cat "${{ steps.find_file.outputs.filepath }}")

          # Escape special characters for Slack JSON.
          content="${content//'%'/'%25'}"
          content="${content//$'\n'/'\\n'}"
          content="${content//$'\r/'\\r'}"
          echo "::set-output name=content::$content"

      # 4. Send to Slack.
      - name: Send to Slack
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "새 소식(${_ steps.find_file.outputs.filepath }})이 도착했습니다! 🚀",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": "📰 새 소식 (${_ steps.find_file.outputs.filepath }})"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${_ steps.newsletter.outputs.content }}"
                  }
                }
              ]
            }
        env:
          # Use the Webhook URL stored in Secrets.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
