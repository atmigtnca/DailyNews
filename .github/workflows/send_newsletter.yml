name: Send Newsletter

on:
  schedule:
    # 10:07 KST (01:07 UTC) - 뉴스레터 (upstream은 07:00 KST에 발행)
    - cron: '7 1 * * *'
    # 16:07 KST (07:07 UTC) - 논문 (upstream은 15:00 KST에 발행)
    - cron: '7 7 * * *'
  workflow_dispatch:

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Sync content from upstream
        # sync-fork 워크플로의 push 타이밍에 의존하지 않도록,
        # 전송 직전에 upstream 최신 내용을 직접 가져와서 사용한다.
        run: |
          git remote add upstream https://github.com/GENEXIS-AI/DailyNews.git
          git fetch upstream
          git checkout upstream/main

      - name: Send today's report to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          git config --global core.quotepath false

          TODAY=$(TZ=Asia/Seoul date +%F)

          # 어느 cron이 깨웠는지에 따라 카테고리 결정 (수동 실행이면 둘 다)
          case "${{ github.event.schedule }}" in
            "7 1 * * *") DIRS="뉴스레터" ;;
            "7 7 * * *") DIRS="논문" ;;
            *)           DIRS="뉴스레터 논문" ;;
          esac

          for DIR in $DIRS; do
            FILE=$(ls "$DIR"/"$TODAY"-*.md 2>/dev/null | sort | tail -n 1)
            if [ -z "$FILE" ]; then
              echo "⚠️ 오늘($TODAY)자 $DIR 리포트가 아직 없습니다. 건너뜁니다."
              continue
            fi
            echo "🚀 Sending file: $FILE"
            FILE_PATH="$FILE" python .github/scripts/send_formatted_slack.py
          done
