name: Send Newsletter to Slack

on:
  push:
    branches:
      - main
    paths:
      # Detect changes in all .md files within the 'DailyNews/뉴스레터/' folder
      - 'DailyNews/뉴스레터/**.md'
      # Detect changes in all .md files within the 'DailyNews/프로덕트/' folder (Added)
      - 'DailyNews/프로덕트/**.md'

jobs:
  send-newsletter:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the repository code.
      #    'fetch-depth: 2' is required to compare the last commit (HEAD)
      #    with the previous one (HEAD~1).
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # 2. Automatically find the path of the changed file from the last commit.
      - name: Find changed newsletter file
        id: find_file
        run: |
          # 'git diff --name-only HEAD~1 HEAD': Lists files changed in the last commit.
          # 'grep -E ...': Filters the list for .md files in our target paths ('뉴스레터' or '프로덕트').
          # 'head -n 1': Selects only the first file if multiple files were changed.
          CHANGED_FILE=$(git diff --name-only HEAD~1 HEAD | grep -E 'DailyNews/뉴스레터/.*\.md|DailyNews/프로덕트/.*\.md' | head -n 1)

          if [ -z "$CHANGED_FILE" ]; then
            echo "::error::No newsletter file found in the last commit's changes."
            exit 1 # Fail the workflow if no matching file is found.
          fi

          echo "Found file: $CHANGED_FILE"
          # Set the found file path as an output variable for the next step.
          echo "::set-output name=filepath::$CHANGED_FILE"

      # 3. Read the content of the file found above and save it as a variable.
      - name: Read newsletter file
        id: newsletter
        run: |
          # Read the content using the dynamic file path (${...}) found in step 2.
          content=$(cat "${{ steps.find_file.outputs.filepath }}")

          # Escape special characters for Slack JSON.
          content="${content//'%'/'%25'}"
          content="${content//$'\n'/'\\n'}"
          content="${content//$'\r'/'\\r'}"
          echo "::set-output name=content::$content"

      # 4. Send to Slack.
      - name: Send to Slack
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "새 소식(${_ steps.find_file.outputs.filepath }})이 도착했습니다! 🚀",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    # Also display the file path in the Slack message header.
                    "text": "📰 새 소식 (${_ steps.find_file.outputs.filepath }})"
                  }
                },
                {
                  "type": "divider"
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${_ steps.newsletter.outputs.content }}"
                  }
                }
              ]
            }
        env:
          # Use the Webhook URL stored in Secrets.
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
