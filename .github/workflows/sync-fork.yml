name: Sync Fork

on:
  schedule:
    # Slack 전송은 send_newsletter가 upstream을 직접 읽으므로 이 워크플로와 무관.
    # 여기서는 fork 저장소 보관용 미러링만 수행 (뉴스레터/논문/프로덕트/오디오).
    # 리포트 발행 시각(07:00 / 12:05 / 15:00 KST) 이후 하루 3번 동기화.
    # KST 08:13 / 13:13 / 17:13 (GitHub 스케줄러 혼잡을 피해 정각 대신 :13 사용)
    - cron: '13 23,4,8 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_PAT }}
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/GENEXIS-AI/DailyNews.git

      - name: Fetch from upstream
        run: git fetch upstream

      - name: Merge from upstream
        run: |
          git checkout main
          git config --global user.name 'github-actions-sync'
          git config --global user.email 'action@github.com'
          git merge upstream/main

      - name: Push changes
        run: git push origin main
