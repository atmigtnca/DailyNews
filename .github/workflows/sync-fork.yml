name: Sync Fork

on:
  schedule:
    # Runs at 00:30 UTC (9:30 AM KST) to catch the morning commit
    - cron: '30 0 * * *'
    # Runs at 03:30 UTC (12:30 PM KST) to catch the ~12:00 PM commit
    - cron: '30 3 * * *'
  # Allows manual triggering from the Actions tab
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 1. Check out the fork repository
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_PAT }}
          fetch-depth: 0 

      # 2. Add the original (upstream) repository as a remote
      - name: Add upstream remote
        run: git remote add upstream https://github.com/GENEXIS-AI/DailyNews.git

      # 3. Fetch the latest changes from the upstream repository
      - name: Fetch from upstream
        run: git fetch upstream

      # 4. Merge the changes from upstream/main into the local main branch
      - name: Merge from upstream
        run: |
          git checkout main
          
          # ◀◀◀ CRITICAL FIX ◀◀◀
          # Set user identity BEFORE merging, as merging can create a commit.
          git config --global user.name 'github-actions-sync'
          git config --global user.email 'action@github.com'
          
          # Now, merge the changes
          git merge upstream/main

      # 5. Push the merged changes back to the fork (origin)
      - name: Push changes
        run: git push origin main
