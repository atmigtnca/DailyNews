name: Sync Fork

on:
  schedule:
    # 09:30 KST (00:30 UTC) - 뉴스레터용
    - cron: '30 0 * * *'
    # 12:30 KST (03:30 UTC) - 프로덕트용
    - cron: '30 3 * * *'
    # 15:30 KST (06:30 UTC) - 논문용 (추가됨)
    - cron: '30 6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_PAT }}
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/GENEXIS-AI/DailyNews.git

      - name: Fetch from upstream
        run: git fetch upstream

      - name: Merge from upstream
        run: |
          git checkout main
          git config --global user.name 'github-actions-sync'
          git config --global user.email 'action@github.com'
          git merge upstream/main

      - name: Push changes
        run: git push origin main
